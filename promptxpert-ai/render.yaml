services:
  - type: web
    name: promptxpert-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn promptxpert.wsgi:application --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # paste your Vercel URL after the frontend deploys
      - key: GROQ_API_KEY
        sync: false   # paste your Groq API key in the Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
